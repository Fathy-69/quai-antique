<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 15 660 365" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cinzel:wght@400;600&amp;display=swap');
      
      .brand-fill { fill: #D4A853; }
      .brand-stroke { 
        stroke: #D4A853; 
        stroke-width: 10; 
        stroke-linecap: round; 
        fill: none; 
      }
      .brand-line {
        stroke: #D4A853;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      
      .title {
        font-family: 'Great Vibes', 'Alex Brush', 'Playfair Display', cursive, serif;
        font-size: 110px;
        fill: #D4A853;
        text-anchor: middle;
      }
      
      .subtitle {
        font-family: 'Cinzel', serif;
        font-size: 24px;
        fill: #D4A853;
        letter-spacing: 16px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Icône (Les 3 barres et la base) -->
  <g id="icon">
    <!-- Barre de gauche -->
    <rect x="355" y="55" width="15" height="50" rx="5" class="brand-fill" />
    <!-- Barre centrale -->
    <rect x="392.5" y="30" width="15" height="75" rx="5" class="brand-fill" />
    <!-- Barre de droite -->
    <rect x="430" y="65" width="15" height="40" rx="5" class="brand-fill" />
    <!-- Base incurvée -->
    <path d="M 340 125 Q 400 115 460 125" class="brand-stroke" />
  </g>

  <!-- Typographie complète "Quai Antique" -->
  <text x="400" y="260" class="title">Quai Antique</text>
  <line x1="220" y1="300" x2="580" y2="300" class="brand-line" />
  <text x="407" y="350" class="subtitle">RESTAURANT</text>
</svg>
